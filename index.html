<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행복한 결혼기념일❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #fdfbf7 100%);
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* 하트 떨어지는 애니메이션 스타일 */
        .heart-fall {
            position: absolute;
            top: -20px;
            color: #ffb3c1;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
            z-index: 10;
        }
        .main-heart {
            font-size: 48px;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
            cursor: pointer;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        h1 {
            font-size: 24px;
            color: #d86975;
            margin-bottom: 8px;
        }
        .names {
            font-size: 18px;
            font-weight: 600;
            color: #777;
            margin-bottom: 25px;
        }
        .dday-box {
            background-color: #fff5f6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .dday-title {
            font-size: 14px;
            color: #d86975;
            margin-bottom: 5px;
        }
        .dday-count {
            font-size: 36px;
            font-weight: bold;
            color: #d86975;
        }
        .message {
            line-height: 1.7;
            font-size: 15px;
            color: #555;
            word-break: keep-all;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-heart" onclick="createBurst()">❤️</div>
    <h1>행복한 결혼기념일</h1>
    <div class="names">박찬식&라영숙</div>

    <div class="dday-box">
        <div class="dday-title"> 결혼하신지</div>
        <div class="dday-count" id="dday">D+0</div>
    </div>

    <p class="message">
        29주년을 진심으로 축하드리며<br>
        앞으로 함께할 날들도 늘 지금처럼 사랑하고 행복하길! ✨
    </p>
</div>

<script>
    // ⚠️ 여기에 결혼식 날짜를 입력하세요 (연도-월-일)
    const weddingDate = new Date("1998-11-09");

    function updateDDay() {
        const today = new Date();
        const diffTime = today - weddingDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
        document.getElementById("dday").innerText = `D+${diffDays}일`;
    }
    updateDDay();

    // 배경에 하트가 떨어지는 함수
    function createFallingHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart-fall");
        heart.innerHTML = "❤️";

        // 랜덤 위치 및 크기, 떨어지는 속도 설정
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 15 + 10 + "px";
        const duration = Math.random() * 3 + 3; // 3초~6초 사이
        heart.style.animationDuration = duration + "s";

        document.body.appendChild(heart);

        // 애니메이션 끝나면 요소 삭제
        setTimeout(() => {
            heart.remove();
        }, duration * 1000);
    }

    // 일정 간격으로 하트 생성 (0.4초마다)
    setInterval(createFallingHeart, 400);

    // 메인 하트 클릭 시 팡 터지는 효과
    function createBurst() {
        for (let i = 0; i < 15; i++) {
            const burstHeart = document.createElement("div");
            burstHeart.classList.add("heart-fall");
            burstHeart.innerHTML = "💖";
            burstHeart.style.left = "50vw";
            burstHeart.style.top = "50vh";

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 150 + 50;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            burstHeart.style.transition = "all 0.8s ease-out";
            document.body.appendChild(burstHeart);

            setTimeout(() => {
                burstHeart.style.transform = `translate(${tx}px, ${ty}px) scale(1.5)`;
                burstHeart.style.opacity = 0;
            }, 10);

            setTimeout(() => {
                burstHeart.remove();
            }, 800);
        }
    }
</script>

</body>
</html>
